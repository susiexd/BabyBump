<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e07a5f">
  <meta name="description" content="BabyBump 手机端胎动记录">
  <link rel="manifest" href="manifest.json">
  <title>BabyBump · 手机记录</title>
  <style>
    :root { --bg:#faf7f2; --surface:#fff; --ink:#2b2420; --muted:#84776d; --accent:#e07a5f; --accent-deep:color-mix(in srgb,var(--accent) 86%,#000); --soft:#fbe9e2; --ok:#6a994e; --line:#eadfd5; }
    html[data-theme="dark"] { --bg:#1a1715; --surface:#24201d; --ink:#f4ede7; --muted:#8f837b; --soft:#3a2c28; --ok:#8fbf6a; --line:#3c342f; color-scheme:dark; }
    html[data-theme="blue"] { --bg:#10172a; --surface:#182238; --ink:#e8eef8; --muted:#6e7c99; --soft:#243052; --ok:#7bc67a; --line:#2a3654; color-scheme:dark; }
    html[data-theme="classic"] { --bg:#111; --surface:#1c1c1c; --ink:#f2f2f2; --muted:#808080; --soft:#2a2a2a; --ok:#7cb86a; --line:#2e2e2e; color-scheme:dark; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
    .app { max-width:520px; min-height:100vh; margin:auto; padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; }
    header { display:flex; justify-content:space-between; align-items:flex-start; }
    h1 { margin:0; font-size:24px; letter-spacing:.02em; } h1 small { display:block; color:var(--muted); font-size:12px; font-weight:500; margin-top:2px; }
    .sync-dot { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:12px; } .dot { width:8px; height:8px; border-radius:50%; background:#c9bdb2; } .dot.ok { background:var(--ok); }
    .hero { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:410px; }
    .kick { width:min(72vw,280px); height:min(72vw,280px); max-width:280px; max-height:280px; border:0; border-radius:50%; color:white; background:radial-gradient(circle at 32% 25%,color-mix(in srgb,var(--accent) 72%,#fff),var(--accent) 58%,var(--accent-deep)); box-shadow:0 16px 38px color-mix(in srgb,var(--accent) 30%,transparent),inset 0 2px rgba(255,255,255,.3); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; transition:transform .1s; -webkit-tap-highlight-color:transparent; }
    .kick:active { transform:scale(.95); } .count { font-size:64px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; } .count small { font-size:18px; font-weight:600; margin-left:4px; }
    .kick-label { margin-top:14px; font-size:18px; font-weight:650; } .hint { color:var(--muted); font-size:13px; margin-top:18px; text-align:center; }
    .cards { display:grid; grid-template-columns:1fr 1fr; gap:12px; } .card { padding:14px; border:1px solid var(--line); border-radius:14px; background:var(--surface); } .label { color:var(--muted); font-size:12px; } .value { margin-top:3px; font-size:21px; font-weight:750; font-variant-numeric:tabular-nums; }
    .toolbar { display:flex; gap:10px; margin-top:14px; } button.secondary { flex:1; border:1px solid var(--line); border-radius:11px; background:var(--surface); color:var(--ink); padding:11px; font:inherit; cursor:pointer; } button.secondary:active { background:var(--soft); }
    .records { margin-top:18px; } .records h2 { font-size:15px; margin:0 0 8px; } .record { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px; } .record span:last-child { color:var(--muted); }
    dialog { width:min(92vw,420px); border:0; border-radius:18px; padding:20px; color:var(--ink); box-shadow:0 20px 60px rgba(43,36,32,.25); } dialog::backdrop { background:rgba(43,36,32,.35); } dialog h2 { margin:0 0 8px; font-size:18px; } dialog p { color:var(--muted); font-size:13px; word-break:break-all; } .pair { display:flex; gap:8px; } .pair input { min-width:0; flex:1; border:1px solid var(--line); border-radius:8px; padding:9px; font:12px monospace; } .close { margin-top:12px; width:100%; padding:10px; border:0; border-radius:9px; background:var(--accent); color:white; font:inherit; }
  </style>
</head>
<body>
  <main class="app">
    <header><h1>BabyBump<small data-i18n="pwa.subtitle">手机端胎动记录</small></h1><div class="sync-dot"><i class="dot" id="dot"></i><span id="syncText" data-i18n="pwa.syncLocal">仅本地</span></div></header>
    <section class="hero"><button class="kick" id="kick"><span class="count" id="count">0<small data-i18n="pwa.countUnit">次</small></span><span class="kick-label" data-i18n="pwa.recordBtn">记录胎动</span></button><div class="hint" data-i18n="pwa.hint">感受到胎动就点一下<br>1 分钟内连续胎动会自动合并</div></section>
    <section class="cards"><div class="card"><div class="label" data-i18n="pwa.todayCount">今日有效记录</div><div class="value" id="today">0 <span data-i18n="pwa.countUnit">次</span></div></div><div class="card"><div class="label" data-i18n="pwa.lastRecord">最近一次</div><div class="value" id="last">--:--</div></div></section>
    <div class="toolbar"><button class="secondary" id="sync" data-i18n="pwa.syncBtn">立即同步</button><button class="secondary" id="pair" data-i18n="pwa.pairBtn">查看配对地址</button></div>
    <section class="records"><h2 data-i18n="pwa.timelineTitle">今日时间线</h2><div id="list"><div class="record"><span data-i18n="pwa.emptyTimeline">还没有记录</span><span data-i18n="pwa.emptyHint">点一下上方按钮</span></div></div></section>
  </main>
  <dialog id="dialog"><h2 data-i18n="pwa.dialogTitle">连接到桌面端</h2><p data-i18n="pwa.dialogDesc">请确保手机和电脑连接同一个 Wi‑Fi，然后在手机浏览器打开下面的地址。地址包含配对令牌，请不要分享给他人。</p><div class="pair"><input id="url" readonly><button class="secondary" id="copy" data-i18n="pwa.copyBtn">复制</button></div><button class="close" id="close" data-i18n="pwa.closeBtn">知道了</button></dialog>
<script>
'use strict';
const KEY='babybump-pwa-state';
let state=JSON.parse(localStorage.getItem(KEY)||'{"records":[],"settings":{}}');
const query = new URLSearchParams(location.search);
const token = query.get('token') || localStorage.getItem('babybump-token') || '';
const apiUrl = location.origin;
if (query.get('token')) localStorage.setItem('babybump-token', query.get('token'));

/* ══════════════ i18n ══════════════ */
let currentLang = 'zh';
let localeData = null;

async function initI18n() {
  // 从 URL 或 localStorage 获取语言偏好
  currentLang = query.get('lang') || localStorage.getItem('babybump-lang') || 'zh';
  try {
    const r = await fetch(apiUrl + '/api/locale/' + currentLang);
    if (r.ok) {
      localeData = await r.json();
    }
  } catch(e) {}
}

function t(key, params = {}) {
  if (!localeData) return key;
  const keys = key.split('.');
  let value = localeData;
  for (const k of keys) {
    if (value && typeof value === 'object') value = value[k];
    else { value = undefined; break; }
  }
  if (value === undefined) return key;
  if (typeof value !== 'string') return key;
  return value.replace(/\{(\w+)\}/g, (_, name) => params[name] ?? `{${name}}`);
}

function countUnit(n) {
  return t(Number(n) === 1 ? 'pwa.countUnitOne' : 'pwa.countUnit');
}

function applyTranslations() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const value = t(key);
    if (value !== key && el.children.length === 0) {
      el.textContent = value;
    }
  });
}

function applyThemeFromSettings() {
  const pref = (state.settings && state.settings.theme) || 'light';
  const accent = (state.settings && state.settings.accent) || '#E07A5F';
  const resolved = pref === 'system'
    ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    : pref;
  document.documentElement.dataset.theme = resolved;
  document.documentElement.style.setProperty('--accent', accent);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', accent);
}

const $=id=>document.getElementById(id); const dayKey=ts=>{const d=new Date(ts);return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`}; const todayKey=()=>dayKey(Date.now());
function validRecords(){return state.records.filter(r=>r.weight>0&&dayKey(r.ts)===todayKey()).sort((a,b)=>a.ts-b.ts)}
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function render(){
  const recs=validRecords();
  $('count').innerHTML=`${recs.length}<small>${countUnit(recs.length)}</small>`;
  $('today').innerHTML=`${recs.length} <span>${countUnit(recs.length)}</span>`;
  $('last').textContent=recs.length?new Date(recs[recs.length-1].ts).toLocaleTimeString(currentLang==='zh'?'zh-CN':'en-US',{hour:'2-digit',minute:'2-digit'}):'--:--';
  $('list').innerHTML=recs.length?recs.slice().reverse().map(r=>`<div class="record"><span>${new Date(r.ts).toLocaleTimeString(currentLang==='zh'?'zh-CN':'en-US',{hour:'2-digit',minute:'2-digit'})}</span><span>${r.src==='mobile'?t('pwa.mobileRecord'):t('pwa.syncedRecord')}</span></div>`).join(''):`<div class="record"><span>${t('pwa.emptyTimeline')}</span><span>${t('pwa.emptyHint')}</span></div>`;
}
function record(){const now=Date.now();const all=state.records.filter(r=>dayKey(r.ts)===todayKey()).sort((a,b)=>a.ts-b.ts);const prev=all[all.length-1];const merge=Number(state.settings.mergeSec??60)*1000;const weight=prev&&state.settings.mergeSec!==0&&now-prev.ts<merge?0:1;state.records.push({id:`mobile-${now}-${Math.random().toString(16).slice(2)}`,ts:now,weight,src:'mobile'});save();render();sync(true);}
async function sync(push=true){
  if(!token||!apiUrl){$('syncText').textContent=t('pwa.syncLocal');return}
  $('syncText').textContent=t('pwa.syncing');
  try{
    if(push){
      const r=await fetch(apiUrl+'/api/state',{method:'POST',headers:{'Content-Type':'application/json','X-BabyBump-Token':token},body:JSON.stringify({records:state.records,settings:state.settings})});
      if(!r.ok)throw Error('post');state=await r.json();
    }else{
      const r=await fetch(apiUrl+'/api/state?token='+encodeURIComponent(token));
      if(!r.ok)throw Error('get');const remote=await r.json();
      const byId=new Map(remote.records.map(x=>[String(x.id),x]));
      state.records.forEach(x=>byId.set(String(x.id),x));
      state.records=[...byId.values()].sort((a,b)=>a.ts-b.ts);
      state.settings={...state.settings,...(remote.settings||{})};save();
    }
    $('dot').classList.add('ok');$('syncText').textContent=t('pwa.synced');applyThemeFromSettings();render();
  }catch(e){$('syncText').textContent=t('pwa.offline');}
}
$('kick').addEventListener('click',record);$('sync').addEventListener('click',()=>sync(true));$('pair').addEventListener('click',async()=>{let url='';try{const r=await fetch(location.origin+'/api/info');if(r.ok){const info=await r.json();url=info.url;}}catch(e){}if(!url&&token)url=location.origin+'/?token='+encodeURIComponent(token);if(!url)url=location.href;$('url').value=url;$('dialog').showModal()});$('copy').addEventListener('click',()=>navigator.clipboard?.writeText($('url').value));$('close').addEventListener('click',()=>$('dialog').close());
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
(async()=>{
  await initI18n();
  applyTranslations();
  applyThemeFromSettings();
  render();
  if(token)sync(false);
})();
</script>
</body>
</html>
